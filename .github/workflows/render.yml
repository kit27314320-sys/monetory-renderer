name: Monetory Render
on:
workflow_dispatch:
inputs:
line1: {description: "Scene 1", required: true, default: "인덕션 볶음팬 고를 때"}
line2: {description: "Scene 2", required: true, default: "28cm 규격을 확인하세요"}
line3: {description: "Scene 3", required: true, default: "테팔 트렌디쿡 볶음팬"}
line4: {description: "Scene 4", required: true, default: "상세 구성은 링크에서 확인"}
permissions:
contents: read
jobs:
render:
runs-on: ubuntu-latest
timeout-minutes: 10
steps:
- name: Install renderer
run: |
sudo apt-get update -qq
sudo apt-get install -y ffmpeg fonts-noto-cjk
- name: Render 1080x1920 MP4
env:
L1: {{ inputs.line2 }}
L3: {{ inputs.line4 }}
run: |
set -euo pipefail
FONT=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
printf '%s' "L2" > s2.txt
printf '%s' "L4" > s4.txt
ffmpeg -y -f lavfi -i "color=c=0x111111:s=1080x1920:d=4" -f lavfi -i "color=c=0x202020:s=1080x1920:d=4" -f lavfi -i "color=c=0x151515:s=1080x1920:d=4" -f lavfi -i "color=c=0x242424:s=1080x1920:d=4" -filter_complex "[0:v]drawtext=fontfile=FONT:textfile=s2.txt:fontcolor=white:fontsize=70:x=(w-text_w)/2:y=(h-text_h)/2[v1];[2:v]drawtext=fontfile=FONT:textfile=s4.txt:fontcolor=white:fontsize=70:x=(w-text_w)/2:y=(h-text_h)/2[v3];[v0][v1][v2][v3]concat=n=4:v=1:a=0[outv]" -map "[outv]" -r 30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart monetory-test.mp4
ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration -of default=noprint_wrappers=1 monetory-test.mp4
- name: Upload MP4
uses: actions/upload-artifact@v4
with:
name: monetory-test-video
path: monetory-test.mp4
retention-days: 1
